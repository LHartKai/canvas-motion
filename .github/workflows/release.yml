name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate next version and tag
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./module.json').version")"

          # Use the latest existing vX.Y.Z tag as the source of truth.
          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"

          if [ -z "$LATEST_TAG" ]; then
            VERSION="$BASE_VERSION"
          else
            LATEST_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: ${TAG}"

      - name: Build Foundry package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/package/canvas-motion
          cp module.json dist/package/canvas-motion/
          cp README.md dist/package/canvas-motion/
          cp -R scripts dist/package/canvas-motion/
          cp -R styles dist/package/canvas-motion/

          # Keep the installed module version in sync with the generated release tag.
          node -e "const fs=require('fs'); const p='dist/package/canvas-motion/module.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\\n');"

          cd dist/package
          zip -r ../canvas-motion.zip canvas-motion
          cd ../..
          cp dist/package/canvas-motion/module.json dist/module.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Canvas Motion v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/canvas-motion.zip
            dist/module.json
